name: Release Recovery Validation

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-recovery.yml'
      - '.github/workflows/windows-companion.yml'
      - '.github/scripts/verify_windows_install.ps1'
      - 'scripts/*release*'
      - 'scripts/test_*release*.py'
      - 'tests/*release*.py'
      - 'scripts/install.sh'
      - 'scripts/install_justrust_ci.sh'
      - 'scripts/build_linux_compat.sh'
  push:
    branches: [master]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-recovery.yml'
      - '.github/workflows/windows-companion.yml'
      - '.github/scripts/verify_windows_install.ps1'
      - 'scripts/*release*'
      - 'scripts/test_*release*.py'
      - 'tests/*release*.py'
      - 'scripts/install.sh'
      - 'scripts/install_justrust_ci.sh'
      - 'scripts/build_linux_compat.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  JCODE_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  JUSTRUST_NO_TELEMETRY: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Recovery regressions exercise historical tags in isolated clones.
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch pinned historical release fixtures
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/1jehuang/jcode.git \
            refs/tags/v0.96.0:refs/tags/v0.96.0 \
            refs/tags/v0.97.0:refs/tags/v0.97.0
          test "$(git rev-parse 'refs/tags/v0.96.0^{commit}')" = 0158295960e7dd5ca8c292d6b2f9d47cab3591b3
          test "$(git rev-parse 'refs/tags/v0.97.0^{commit}')" = 94392e100dd05868172c9884944d97bd1eee5d8e

      - name: Test recovery, exact-commit authorization, public assets and watcher
        run: python3 -m unittest discover -s tests -p '*release*.py'
      - name: Test release preparation and announcements
        run: python3 -m unittest discover -s scripts -p 'test_*release*.py'
      - name: Test installer release metadata validation
        run: bash scripts/test_install_release_metadata.sh
