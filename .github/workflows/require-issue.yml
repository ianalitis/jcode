name: Require Linked Issue

env:
  JCODE_CI: "1"
  # Owner/repo whose issues also satisfy this gate. Empty disables the fallback,
  # which is the upstream behavior. Forks set this to their parent repository.
  FORK_PARENT: "1jehuang/jcode"

# Ensure every pull request is linked to a REAL GitHub issue in this repo.
# A PR passes when it links an issue via any of:
#   * GitHub's "Development" sidebar (closing issue reference), or
#   * a closing keyword in the body/title (e.g. "Closes #123"), or
#   * a plain mention (#123 / owner/repo#123) or full issue URL.
# Any referenced number is verified against the API: it must resolve to an
# existing issue (not a pull request) in this repository.
#
# In a fork, an issue in the upstream parent repository also satisfies the gate:
# a fork PR exists to be contributed upstream, so requiring a duplicate issue in
# the fork would force busywork. Set FORK_PARENT (owner/repo) below to enable it.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: require-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-issue:
    name: Require Linked Issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for a linked, existing issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull_request payload; skipping.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const text = `${pr.title || ''}\n\n${pr.body || ''}`;

            // Collect candidate issue numbers that belong to THIS repo.
            const candidates = new Set();

            // A fork may point at an issue in its parent repository instead of
            // opening a duplicate issue of its own.
            const parent = (process.env.FORK_PARENT || '').trim().toLowerCase();
            const [parentOwner, parentRepo] = parent.includes('/')
              ? parent.split('/')
              : [null, null];
            const sameRepo = (o, r) =>
              o.toLowerCase() === owner.toLowerCase() &&
              r.toLowerCase() === repo.toLowerCase();
            const parentRepoMatches = (o, r) =>
              parentOwner !== null &&
              o.toLowerCase() === parentOwner &&
              r.toLowerCase() === parentRepo;

            // Full issue URLs: https://github.com/owner/repo/issues/123
            // Candidates are tagged with the repo they belong to.
            const urlRe = /https?:\/\/github\.com\/([\w.-]+)\/([\w.-]+)\/issues\/(\d+)/gi;
            for (const m of text.matchAll(urlRe)) {
              if (sameRepo(m[1], m[2])) {
                candidates.add({ owner, repo, num: Number(m[3]) });
              } else if (parentRepoMatches(m[1], m[2])) {
                candidates.add({ owner: parentOwner, repo: parentRepo, num: Number(m[3]) });
              }
            }

            // owner/repo#123 or bare #123 (bare assumed to be this repo).
            const refRe = /(?:([\w.-]+)\/([\w.-]+))?#(\d+)/g;
            for (const m of text.matchAll(refRe)) {
              const refOwner = m[1];
              const refRepo = m[2];
              const num = Number(m[3]);
              if (!refOwner && !refRepo) {
                candidates.add({ owner, repo, num }); // bare #123 -> this repo
              } else if (sameRepo(refOwner, refRepo)) {
                candidates.add({ owner, repo, num });
              } else if (parentRepoMatches(refOwner, refRepo)) {
                candidates.add({ owner: parentOwner, repo: parentRepo, num });
              }
            }

            // Issues linked via the Development sidebar (closing references).
            try {
              const query = `query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first: 10) { nodes { number } }
                  }
                }
              }`;
              const result = await github.graphql(query, { owner, repo, number: pr.number });
              const nodes = result?.repository?.pullRequest?.closingIssuesReferences?.nodes || [];
              for (const n of nodes) candidates.add({ owner, repo, num: Number(n.number) });
            } catch (err) {
              core.warning(`Could not query closing issue references: ${err}`);
            }

            // Verify at least one candidate is a real issue (not a PR, not this PR).
            let linkedIssue = null;
            for (const cand of candidates) {
              if (cand.owner === owner && cand.repo === repo && cand.num === pr.number) continue;
              try {
                const { data } = await github.rest.issues.get({
                  owner: cand.owner,
                  repo: cand.repo,
                  issue_number: cand.num,
                });
                if (!data.pull_request) { // issues have no pull_request field
                  linkedIssue = cand;
                  break;
                }
              } catch (err) {
                // 404 -> number doesn't exist; ignore and keep checking.
              }
            }

            if (!linkedIssue) {
              const parentHint = parentOwner !== null
                ? ` or in ${parentOwner}/${parentRepo}`
                : '';
              core.setFailed(
                'This PR must be linked to an existing GitHub issue in this repository' +
                  parentHint + '. Add a closing keyword (e.g. "Closes #123") to the PR ' +
                  'description, link an issue via the Development sidebar, or reference an ' +
                  'existing issue number (e.g. "#123"). If no issue exists yet, please open ' +
                  'one first.'
              );
              return;
            }

            core.info(
              `Linked to existing issue ${linkedIssue.owner}/${linkedIssue.repo}#` +
                `${linkedIssue.num}. ✅`
            );
