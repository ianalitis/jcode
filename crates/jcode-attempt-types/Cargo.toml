[package]
name = "jcode-attempt-types"
version = "0.1.0"
edition = "2024"
publish = false

# Pure data contracts for frozen attempts, receipts and data-class admission.
# See docs/HARNESS_LOOP_ARCHITECTURE.md. No I/O, no app-core dependency.

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
